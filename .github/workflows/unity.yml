name: Unity

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Unity project structure
        shell: bash
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings
          test -f ProjectSettings/ProjectVersion.txt
